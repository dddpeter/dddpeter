    <circle cx="872" cy="105" r="2" opacity="0.75"/>
    <circle cx="1018" cy="58" r="3" fill="#B87AFF" opacity="1"/>
    <circle cx="1108" cy="32" r="2.5" opacity="0.8"/>
    <circle cx="1188" cy="96" r="2.5" fill="#FF8F00" opacity="0.9"/>
    <circle cx="1148" cy="142" r="2" opacity="0.75"/>
    <circle cx="1042" cy="118" r="2.5" fill="#B87AFF" opacity="0.85"/>
    <circle cx="628" cy="178" r="2" fill="#FFB74D" opacity="0.7"/>
    <circle cx="700" cy="120" r="1.5" opacity="0.45"/>
    <circle cx="452" cy="338" r="2" opacity="0.35"/>
    <circle cx="392" cy="518" r="2" fill="#FF8F00" opacity="0.6"/>
    <circle cx="608" cy="558" r="1.8" opacity="0.45"/>
    <circle cx="702" cy="432" r="1.5" fill="#B87AFF" opacity="0.6"/>
    <circle cx="1240" cy="420" r="2" opacity="0.45"/>
    <circle cx="1312" cy="468" r="1.6" fill="#FF8F00" opacity="0.6"/>
    <circle cx="1258" cy="196" r="2" opacity="0.5"/>
    <circle cx="1352" cy="262" r="1.6" opacity="0.35"/>
    <circle cx="880" cy="258" r="1.5" opacity="0.4"/>
    <circle cx="545" cy="470" r="1.5" fill="#FFB74D" opacity="0.5"/>
    <circle cx="1508" cy="196" r="2" fill="#B87AFF" opacity="0.5"/>
    <circle cx="1618" cy="318" r="1.8" opacity="0.4"/>
    <circle cx="1758" cy="268" r="2" fill="#B87AFF" opacity="0.4"/>
  </g>

  <!-- 中央光球（南瓜月） -->
  <ellipse cx="1020" cy="368" rx="80" ry="18" fill="url(#moon)"/>
  <circle cx="1020" cy="368" r="34" fill="#FF8F00" opacity="0.3"/>
  <circle cx="1020" cy="368" r="20" fill="#FFB74D" opacity="0.5"/>
  <circle cx="1020" cy="368" r="11" fill="#FFE3B0"/>

  <!-- SINCE 2012 装饰圆环 -->
  <circle cx="150" cy="600" r="42" stroke="#FF8F00" stroke-width="1.2" fill="none" opacity="0.55"/>

  <!-- 左侧主文案 -->
  <text x="118" y="248" font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="118" font-weight="800" fill="#F5F5F5">dddpeter</text>
  <text x="122" y="318" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#FF8F00" letter-spacing="12">烈焰之雨</text>
  <text x="122" y="420" font-family="'Segoe UI','PingFang SC',Helvetica,Arial,sans-serif" font-size="33" font-style="italic" font-weight="500" fill="#CDCDCD">Building tools that turn ideas into engineering solutions.</text>
  <text x="122" y="577" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FF8F00" letter-spacing="6">SINCE 2012</text>
  <text x="122" y="630" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="700" fill="#F5F5F5">14 年 · 6 个精选项目</text>

  <!-- 右侧 CURRENT FOCUS -->
  <text x="1340" y="222" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#B87AFF" letter-spacing="8">CURRENT FOCUS</text>
  <text x="1340" y="282" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#E3D4F6">DevOps 自动化 · macOS 效率 · 跨平台</text>
  <text x="1340" y="330" font-family="'Segoe UI','PingFang SC',sans-serif" font-size="32" fill="#E3D4F6">Rust · Flutter · WebAssembly</text>

  <!-- 中部公众号 -->
  <text x="932" y="575" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="#42AA00" letter-spacing="6">公众号</text>
  <text x="932" y="622" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#F5F5F5">烈焰之雨空间</text>

  <!-- 右下 slogan -->
  <text x="1930" y="690" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" fill="#CDCDCD" opacity="0.75">烈焰般热忱 · 细雨般分享</text>
</svg>
