    <line x1="1018" y1="58" x2="1108" y2="32"/>
    <line x1="1018" y1="58" x2="872" y2="105"/>
    <line x1="872" y1="105" x2="838" y2="66"/>
    <line x1="1018" y1="58" x2="1042" y2="118"/>
    <line x1="1042" y1="118" x2="1148" y2="142"/>
    <line x1="1108" y1="32" x2="1188" y2="96"/>
    <line x1="1188" y1="96" x2="1148" y2="142"/>
  </g>

  <!-- 星点 -->
  <g fill="#FFFFFF">
